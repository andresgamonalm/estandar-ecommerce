 revisión de","rotuloBloque":"Temas sugeridos para revisión de","leyendaMuestra":"Sobre gris","leyendaTexto":"Temas sugeridos para revisión del área que se indica.","volver":"↑ Volver al índice"}</script><script id="logica">
(() => {
  'use strict';

  /* ═══ 1 · LOS DATOS ════════════════════════════════════════════════
     El documento entero vive acá. La pantalla se dibuja desde esto, no
     al revés: al mover, agregar o borrar algo, la numeración, las hojas
     y los números de página del índice se rehacen solos. */
  let DOC = JSON.parse(document.getElementById('datos-iniciales').textContent);

  /* Rótulos que se repiten en varias partes. Son editables; si el
     archivo viene de una versión anterior, toman su texto de siempre. */
  const ROTULOS = {
    tituloIndice: 'Contenido',
    rotuloEtapa: 'Etapa',
    rotuloPunto: 'Sugerido para revisión de',
    rotuloBloque: 'Temas sugeridos para revisión de',
    leyendaMuestra: 'Sobre gris',
    leyendaTexto: 'Temas sugeridos para revisión del área que se indica.',
    volver: '↑ Volver al índice'
  };
  for (const k in ROTULOS) if (DOC[k] == null) DOC[k] = ROTULOS[k];

  let edicion = false;
  /* Versión publicada: si la barra no trae el botón «Editar», el documento
     es solo de lectura y no se activa ninguna función de edición. */
  const PUBLICADO = !document.getElementById('b-editar');
  let anterior = null;
  let pintandoEdicion = false;        // el modo con que se está armando el HTML
  let PAGINAS = [], NUMS = null, UNIDADES = [];
  const HOJA_INDICE = 2;              // la portada es la 1; el índice parte en la 2
  const $ = s => document.querySelector(s);
  const lienzo = $('#lienzo');
  const aviso  = $('#aviso');

  /* Hoja invisible donde se prueba qué cabe en cada página. No forma
     parte del documento y no se guarda. */
  const medidor = document.createElement('div');
  medidor.id = 'medidor';
  medidor.setAttribute('aria-hidden', 'true');
  document.body.appendChild(medidor);

  /* ¿Está abierto dentro del visor, o es el archivo en el computador de
     la persona? De eso depende cómo se guarda. */
  const enVisor = typeof window.claude !== 'undefined' && typeof window.claude.use === 'function';

  const decir = (txt, mal) => {
    if (!aviso) return;            // la versión publicada no tiene barra ni avisos
    aviso.textContent = txt;
    if (mal) aviso.setAttribute('data-mal', '1'); else aviso.removeAttribute('data-mal');
  };
  const esc = t => String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  /* Una cifra no se separa de su unidad al cortar la línea («95 %»,
     «2,5 segundos», «44 px»). Se aplica al mostrar, no a los datos. */
  const fino = t => String(t)
    .replace(/(\d) (%|×|px|KB|MB|segundos?|milisegundos|caracteres|días)/g, '$1\u00a0$2')
    .replace(/× (\d)/g, '×\u00a0$1');
  const rico = t => fino(esc(t))
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    /* Enlace: [texto](https://…) — abre en otra pestaña y funciona en el PDF. */
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a class="enlace" href="$2" target="_blank" rel="noopener">$1</a>');

  /* ═══ 2 · PIEZAS DE CADA HOJA ══════════════════════════════════════ */
  /* Cada sección tiene su color de destacado (cinco colores de Zurich). */
  const colorEtapa = ie => `etapa--${(ie % 5) + 1}`;

  /* Un texto editable. Todos los textos del documento pasan por acá:
     en modo edición se pueden cambiar, y si el mismo texto aparece en
     varias partes (un título en el índice y en su hoja), cambia en
     todas mientras se escribe. */
  function tx(campo, valor, o = {}) {
    return `<span class="tx${o.clase ? ' ' + o.clase : ''}"`
      + (o.ruta != null ? ` data-ruta="${o.ruta}"` : '')
      + ` data-campo="${campo}"`
      + (o.pista ? ` data-pista="${esc(o.pista)}"` : '')
      + (o.rico ? ' data-rico="1"' : '')
      + (pintandoEdicion ? ' contenteditable="true"' : '')
      + `>${o.rico ? rico(valor) : fino(esc(valor))}</span>`;
  }

  const quitar = (tipo, ruta, que) => !pintandoEdicion ? '' :
    `<button type="button" class="quitar" data-quitar="${tipo}" data-ruta="${ruta}" title="Quitar ${que}" aria-label="Quitar ${esc(que)}">&#10005;</button>`;

  /* Capítulo anterior o siguiente, aunque esté en otra etapa. Sirve
     para que las flechas pasen un punto de un capítulo al vecino. */
  function capVecino(ie, ib, dir) {
    let e = ie, b = ib + dir;
    while (e >= 0 && e < DOC.etapas.length) {
      const n = DOC.etapas[e].bloques.length;
      if (b >= 0 && b < n) return [e, b];
      e += dir;
      if (e < 0 || e >= DOC.etapas.length) break;
      b = dir < 0 ? DOC.etapas[e].bloques.length - 1 : 0;
    }
    return null;
  }

  /* Botón para agregar un punto justo debajo de otro. */
  const insertar = ruta => !pintandoEdicion ? '' :
    `<button type="button" class="insertar" data-insertar="${ruta}" title="Agregar un punto debajo" aria-label="Agregar un punto debajo">+</button>`;

  /* Flechas para subir o bajar un punto o un capítulo. */
  const mover = (tipo, ruta, primero, ultimo) => !pintandoEdicion ? '' :
    `<span class="mover">`
    + `<button type="button" data-mover="${tipo}" data-ruta="${ruta}" data-dir="-1"${primero ? ' disabled' : ''} title="Subir" aria-label="Subir">↑</button>`
    + `<button type="button" data-mover="${tipo}" data-ruta="${ruta}" data-dir="1"${ultimo ? ' disabled' : ''} title="Bajar" aria-label="Bajar">↓</button>`
    + `</span>`;

  const sumar = (tipo, ruta, texto, clase) => !pintandoEdicion ? '' :
    `<button type="button" class="sumar${clase ? ' ' + clase : ''}" data-sumar="${tipo}"${ruta != null ? ` data-ruta="${ruta}"` : ''}>${texto}</button>`;

  /* Rótulo «Sugerido para revisión de …». Se muestra cuando el punto o
     el capítulo tiene un área escrita; en modo edición aparece vacío
     para poder escribirla. Borrar el área quita la marca. */
  function rotulo(ruta, area, nivel) {
    const campo = nivel === 'bloque' ? 'rotuloBloque' : 'rotuloPunto';
    return `<span class="sugiere${nivel === 'bloque' ? ' sugiere--bloque' : ''}${area ? '' : ' sugiere--vacio'}">`
      + tx(campo, DOC[campo], { clase: 'sugiere__rotulo' }) + ' '
      + tx('revisa', area, { ruta, pista: 'área, opcional', clase: 'sugiere__area' })
      + `</span>`;
  }

  /* Franja azul de cada hoja. La firma va solo en la portada. */
  function franja(portada) {
    return `<div class="pagina__franja">`
      + (DOC.logo ? `<img class="franja__logo" src="${esc(DOC.logo)}" alt="Zurich">` : '')
      + `<span class="franja__barra"></span>`
      + tx('cintillo', DOC.cintillo, { clase: 'franja__area' })
      + (portada ? `<span class="franja__firma"><a href="mailto:${esc(DOC.correo || '')}">${esc(DOC.firma || '')}</a></span>` : '')
      + `</div>`;
  }

  /* Pie de cada hoja: «Volver al índice», el texto del pie y el número. */
  function pie(num, conVolver) {
    const volver = conVolver
      ? `<a class="volver" href="#hoja-${HOJA_INDICE}" data-ir="hoja-${HOJA_INDICE}">${tx('volver', DOC.volver)}</a>` : '';
    return `<div class="pagina__pie"><div>`
      + `<span class="pie__izq">${volver}</span>`
      + `<span class="pie__centro">${tx('pie', DOC.pie || '')}</span>`
      + `<span class="pie__der">${num > 1 ? num : ''}</span>`
      + `</div></div>`;
  }

  function banda(ie) {
    const e = DOC.etapas[ie];
    return `<div class="etapa__banda">`
      + `<span class="etapa__n">${tx('rotuloEtapa', DOC.rotuloEtapa)} ${ie + 1}</span>`
      + `<h2>${tx('titulo', e.titulo, { ruta: ie, pista: 'Nombre de la etapa' })}</h2>`
      + `<p>${tx('nota', e.nota, { ruta: ie, pista: 'Descripción' })}</p>`
      + mover('etapa', ie, ie === 0, ie === DOC.etapas.length - 1)
      + quitar('etapa', ie, 'la etapa ' + e.titulo)
      + `</div>`;
  }

  /* ═══ 3 · LAS HOJAS ════════════════════════════════════════════════ */
  function hojaPortada() {
    return `<section class="pagina pagina--portada" id="hoja-1" data-cap="portada">${franja(true)}`
      + `<div class="pagina__cuerpo"><div class="cabecera">`
      + `<p class="ojo">${tx('ojo', DOC.ojo || '')}</p>`
      + `<h1>${tx('titulo', DOC.titulo)}</h1>`
      + `<div class="regla"></div>`
      + `<p class="entrada">${tx('bajada', DOC.bajada, { rico: true })}</p>`
      + `<p class="meta">${(DOC.meta || []).map((l, k) => tx('meta.' + k, l)).join('<br>')}</p>`
      + `<p class="leyenda"><span class="leyenda__muestra">${tx('leyendaMuestra', DOC.leyendaMuestra)}</span>`
      + `${tx('leyendaTexto', DOC.leyendaTexto)}</p>`
      + `</div></div>${pie(1, false)}</section>`;
  }

  /* Las piezas del índice, en orden: cada etapa, sus capítulos y el
     cierre. Si no caben en una hoja, siguen en la siguiente. */
  function unidadesIndice() {
    const u = [];
    DOC.etapas.forEach((e, ie) => {
      u.push({ t: 'etapa', ie });
      e.bloques.forEach((b, ib) => u.push({ t: 'cap', ie, ib }));
    });
    if (DOC.cierre) u.push({ t: 'cierre' });
    return u;
  }

  function hojaIndice(unidades, primera, num, NUM) {
    const h = [`<section class="pagina pagina--indice" id="hoja-${num}" data-cap="indice">${franja(false)}`];
    h.push(`<div class="pagina__cuerpo"><nav class="indice"${primera ? ' id="indice"' : ''}>`);
    h.push(`<h2>${tx('tituloIndice', DOC.tituloIndice)}${primera ? '' : ' <span class="continua">(continuación)</span>'}</h2>`);
    let abierta = false;
    const cerrar = () => { if (abierta) { h.push(`</div></div>`); abierta = false; } };
    unidades.forEach(un => {
      if (un.t === 'etapa') {
        cerrar();
        const e = DOC.etapas[un.ie], n = NUM.etapa[un.ie];
        h.push(`<div class="indice__etapa ${colorEtapa(un.ie)}">`);
        h.push(`<a class="indice__cabeza" href="#hoja-${n}" data-ir="hoja-${n}">`
          + `${tx('rotuloEtapa', DOC.rotuloEtapa)} ${un.ie + 1} · ${tx('titulo', e.titulo, { ruta: un.ie })}</a>`);
        h.push(`<div class="indice__lista">`);
        abierta = true;
      } else if (un.t === 'cap') {
        if (!abierta) { h.push(`<div class="indice__etapa ${colorEtapa(un.ie)}"><div class="indice__lista">`); abierta = true; }
        const n = NUM.cap[`${un.ie}.${un.ib}`];
        h.push(`<a class="indice__fila" href="#hoja-${n}" data-ir="hoja-${n}"><b>${un.ie + 1}.${un.ib + 1}</b>`
          + `${tx('titulo', DOC.etapas[un.ie].bloques[un.ib].titulo, { ruta: `${un.ie}.${un.ib}` })}<i>${n}</i></a>`);
      } else {
        cerrar();
        h.push(`<a class="indice__fila indice__cierre" href="#hoja-${NUM.cierre}" data-ir="hoja-${NUM.cierre}">`
          + `${tx('cierre.titulo', DOC.cierre.titulo)}<i>${NUM.cierre}</i></a>`);
      }
    });
    cerrar();
    if (!DOC.etapas.length) {
      h.push(`<p class="vacio">El documento no tiene etapas. Usa «+ etapa» para empezar.</p>`);
      h.push(sumar('etapa', null, '+ etapa'));
    }
    h.push(`</nav></div>${pie(num, false)}</section>`);
    return h.join('');
  }

  /* Un capítulo, o la parte de él que cabe en esta hoja. Si viene de
     la hoja anterior, repite su título con la marca de continuación. */
  function segmento(ie, ib, desde, hasta) {
    const e = DOC.etapas[ie], b = e.bloques[ib];
    const rb = b.revisa || '', continua = desde > 0, termina = hasta >= b.puntos.length;
    const h = [`<div class="bloque${rb ? ' bloque--sugerido' : ''}${continua ? ' bloque--sigue' : ''}"${continua ? '' : ` id="cap-${ie}-${ib}"`} data-seg="${ie}.${ib}">`];
    /* Si el capítulo viene de la hoja anterior, la lista sigue sin título. */
    if (!continua) {
      h.push(`<h3><span class="num">${ie + 1}.${ib + 1}</span>`);
      h.push(tx('titulo', b.titulo, { ruta: `${ie}.${ib}`, pista: 'Nombre del capítulo' }));
      h.push(mover('bloque', `${ie}.${ib}`, ib === 0 && ie === 0,
        ib === e.bloques.length - 1 && ie === DOC.etapas.length - 1) + quitar('bloque', `${ie}.${ib}`, 'el capítulo'));
      h.push(`</h3>`);
      if (rb || pintandoEdicion) h.push(rotulo(`${ie}.${ib}`, rb, 'bloque'));
    }
    h.push(`<ul>`);
    if (!b.puntos.length) h.push(`<li><span class="vacio">Sin puntos.</span></li>`);
    for (let ip = desde; ip < hasta; ip++) {
      const p = b.puntos[ip], rp = p.revisa || '', ruta = `${ie}.${ib}.${ip}`;
      h.push(`<li${rp ? ' class="li--sugerido"' : ''}><div class="cuerpo">`);
      if (rp) h.push(rotulo(ruta, rp, 'punto'));
      h.push(tx('t', p.t, { ruta, pista: 'Escribe el punto', rico: true }));
      if (p.n || pintandoEdicion) h.push(tx('n', p.n, { ruta, pista: 'Nota al pie, opcional', clase: 'dato' }));
      if (!rp && pintandoEdicion) h.push(rotulo(ruta, '', 'punto'));
      const primeroDoc = ip === 0 && !capVecino(ie, ib, -1);
      const ultimoDoc = ip === b.puntos.length - 1 && !capVecino(ie, ib, 1);
      h.push(`</div>${insertar(ruta)}${mover('punto', ruta, primeroDoc, ultimoDoc)}${quitar('punto', ruta, 'este punto')}</li>`);
    }
    h.push(`</ul>`);
    if (termina) h.push(sumar('punto', `${ie}.${ib}`, '+ punto'));
    h.push(`</div>`);
    return h.join('');
  }

  /* Hoja de una etapa. La etapa empieza siempre en hoja nueva; sus
     capítulos van seguidos y, si no caben, continúan en la siguiente. */
  function hojaCapitulo(pg, num) {
    const { ie, segs, primeraDeEtapa, ultimaDeEtapa } = pg;
    const e = DOC.etapas[ie];
    const h = [`<section class="pagina ${colorEtapa(ie)}" id="hoja-${num}" data-cap="${ie}.${segs.length ? segs[0].ib : 'v'}">${franja(false)}`];
    h.push(`<div class="pagina__cuerpo">`);
    if (primeraDeEtapa) h.push(banda(ie));
    segs.forEach(sg => h.push(segmento(ie, sg.ib, sg.desde, sg.hasta)));
    if (ultimaDeEtapa) h.push(sumar('bloque', ie, `+ capítulo en «${esc(e.titulo)}»`));
    if (ultimaDeEtapa && ie === DOC.etapas.length - 1) h.push(sumar('etapa', null, '+ etapa'));
    h.push(`</div>${pie(num, true)}</section>`);
    return h.join('');
  }

  /* Etapa que se quedó sin capítulos: su banda y el botón para agregar. */
  function hojaEtapaVacia(pg, num) {
    const ie = pg.ie;
    return `<section class="pagina ${colorEtapa(ie)}" id="hoja-${num}" data-cap="${ie}.v">${franja(false)}`
      + `<div class="pagina__cuerpo">${banda(ie)}<p class="vacio">Esta etapa no tiene capítulos.</p>`
      + sumar('bloque', ie, `+ capítulo en «${esc(DOC.etapas[ie].titulo)}»`)
      + (ie === DOC.etapas.length - 1 ? sumar('etapa', null, '+ etapa') : '')
      + `</div>${pie(num, true)}</section>`;
  }

  function hojaCierre(num) {
    const c = DOC.cierre;
    const h = [`<section class="pagina" id="hoja-${num}" data-cap="cierre">${franja(false)}<div class="pagina__cuerpo">`];
    h.push(`<div class="cierre" id="cierre">`);
    h.push(`<h2>${tx('cierre.titulo', c.titulo)}</h2>`);
    h.push(`<p>${tx('cierre.nota', c.nota)}</p>`);
    h.push(`<div class="bifurcaciones">`);
    c.bifurcaciones.forEach((f, i) => {
      h.push(`<div class="bif"><b>${tx('titulo', f.titulo, { ruta: 'c.' + i, pista: 'Título' })}`
        + `${mover('bif', i, i === 0, i === c.bifurcaciones.length - 1)}${quitar('bif', i, f.titulo)}</b>`
        + `${tx('texto', f.texto, { ruta: 'c.' + i, pista: 'Descripción', clase: 'tx2' })}</div>`);
    });
    h.push(`</div>${sumar('bif', null, '+ decisión')}</div>`);
    h.push(`</div>${pie(num, true)}</section>`);
    return h.join('');
  }

  function hoja(p) {
    if (p.tipo === 'portada')    return hojaPortada();
    if (p.tipo === 'indice')     return hojaIndice(UNIDADES.slice(p.desde, p.hasta), p.primera, p.num, NUMS);
    if (p.tipo === 'capitulo')   return hojaCapitulo(p, p.num);
    if (p.tipo === 'etapaVacia') return hojaEtapaVacia(p, p.num);
    if (p.tipo === 'cierre')     return hojaCierre(p.num);
    return '';
  }

  /* ═══ 4 · PAGINAR ══════════════════════════════════════════════════
     Se prueba cada hoja en la hoja invisible, con las medidas exactas
     del papel. Si un capítulo no cabe, se busca cuántos puntos entran y
     el resto pasa a una hoja de continuación. La paginación es siempre
     la del papel, aunque se esté mirando en un teléfono: por eso los
     números del índice coinciden con los de la impresión. */
  function paginar() {
    const modo = pintandoEdicion;
    pintandoEdicion = false;          // se mide como se va a imprimir
    const cabe = html => {
      medidor.innerHTML = html;
      const c = medidor.querySelector('.pagina__cuerpo');
      return c.scrollHeight <= c.clientHeight + 1;
    };
    /* La mayor cantidad que cabe, entre 1 y el total. */
    const cuantosCaben = (total, prueba) => {
      if (total <= 0 || prueba(total)) return total;
      let bajo = 1, alto = total - 1, mejor = 1;
      while (bajo <= alto) {
        const medio = (bajo + alto) >> 1;
        if (prueba(medio)) { mejor = medio; bajo = medio + 1; } else alto = medio - 1;
      }
      return mejor;
    };

    /* 1. Hojas de cada etapa. Se van llenando con capítulos seguidos;
       un capítulo que no cabe sigue en la hoja siguiente. Para que un
       título no quede casi solo al pie, si de un capítulo caben menos de
       dos puntos, el capítulo entero pasa a la hoja siguiente. */
    const caps = [];
    DOC.etapas.forEach((e, ie) => {
      if (!e.bloques.length) { caps.push({ tipo: 'etapaVacia', ie }); return; }
      let segs = [], primera = true;
      const probar = lista => cabe(hojaCapitulo({ tipo: 'capitulo', ie, segs: lista, primeraDeEtapa: primera, ultimaDeEtapa: false }, 88));
      const cerrarHoja = () => { caps.push({ tipo: 'capitulo', ie, segs, primeraDeEtapa: primera, ultimaDeEtapa: false }); segs = []; primera = false; };
      e.bloques.forEach((b, ib) => {
        const n = b.puntos.length;
        let desde = 0;
        while (true) {
          const todo = { ib, desde, hasta: n };
          if (probar([...segs, todo])) { segs.push(todo); break; }
          const resto = n - desde;
          let k = 0;
          if (resto > 0 && probar([...segs, { ib, desde, hasta: desde + 1 }])) {
            let bajo = 2, alto = resto - 1; k = 1;
            while (bajo <= alto) {
              const m = (bajo + alto) >> 1;
              if (probar([...segs, { ib, desde, hasta: desde + m }])) { k = m; bajo = m + 1; } else alto = m - 1;
            }
          }
          /* Tampoco quedan menos de dos puntos solos en la hoja siguiente:
             se dejan dos para allá, o el capítulo corto pasa entero. */
          if (k > 0 && resto - k < 2) {
            if (resto >= 4) k = resto - 2;
            else if (segs.length) k = 0;
          }
          /* Un capítulo que empieza al pie deja al menos dos líneas de texto
             bajo su título: dos puntos, o un punto que ocupe dos líneas. */
          const dosLineas = () => {
            cabe(hojaCapitulo({ tipo: 'capitulo', ie, segs: [...segs, { ib, desde, hasta: desde + 1 }], primeraDeEtapa: primera, ultimaDeEtapa: false }, 88));
            const li = medidor.querySelector(`.bloque[data-seg="${ie}.${ib}"] li`);
            return !!li && li.getBoundingClientRect().height >= 1.8 * (parseFloat(getComputedStyle(li).lineHeight) || 21);
          };
          if (segs.length && k < Math.max(1, Math.min(2, resto)) && !(k === 1 && dosLineas())) { cerrarHoja(); continue; }
          if (!segs.length && k === 0) { if (resto === 0) { segs.push(todo); break; } k = 1; }
          segs.push({ ib, desde, hasta: desde + k });
          desde += k;
          cerrarHoja();
        }
      });
      if (segs.length) cerrarHoja();
      caps[caps.length - 1].ultimaDeEtapa = true;
    });

    /* 2. Hojas del índice (se miden con números de prueba) */
    UNIDADES = unidadesIndice();
    const prueba = { etapa: {}, cap: {}, cierre: 88 };
    DOC.etapas.forEach((e, ie) => { prueba.etapa[ie] = 88; e.bloques.forEach((b, ib) => { prueba.cap[`${ie}.${ib}`] = 88; }); });
    const indices = [];
    let i0 = 0;
    do {
      let k = cuantosCaben(UNIDADES.length - i0,
        k => cabe(hojaIndice(UNIDADES.slice(i0, i0 + k), i0 === 0, 88, prueba)));
      /* La cabeza de una etapa no queda sola al final de la hoja. */
      if (i0 + k < UNIDADES.length && k > 1 && UNIDADES[i0 + k - 1].t === 'etapa') k -= 1;
      indices.push({ tipo: 'indice', desde: i0, hasta: i0 + k, primera: i0 === 0 });
      if (k <= 0) break;
      i0 += k;
    } while (i0 < UNIDADES.length);

    /* 3. Numeración final */
    const paginas = [{ tipo: 'portada' }, ...indices, ...caps];
    if (DOC.cierre) paginas.push({ tipo: 'cierre' });
    const NUM = { etapa: {}, cap: {}, cierre: 0 };
    paginas.forEach((p, i) => {
      p.num = i + 1;
      if (p.tipo === 'capitulo') {
        p.segs.forEach(sg => { if (sg.desde === 0) NUM.cap[`${p.ie}.${sg.ib}`] = p.num; });
        if (NUM.etapa[p.ie] == null) NUM.etapa[p.ie] = p.num;
      }
      if (p.tipo === 'etapaVacia') NUM.etapa[p.ie] = p.num;
      if (p.tipo === 'cierre') NUM.cierre = p.num;
    });
    medidor.innerHTML = '';
    pintandoEdicion = modo;
    PAGINAS = paginas; NUMS = NUM;
  }

  /* ═══ 5 · DIBUJAR ══════════════════════════════════════════════════ */
  function lateral() {
    const h = [`<aside class="lateral" aria-label="Índice lateral">`];
    h.push(`<a class="lateral__titulo" href="#hoja-${HOJA_INDICE}" data-ir="hoja-${HOJA_INDICE}" data-lat="indice">${tx('tituloIndice', DOC.tituloIndice)}</a>`);
    DOC.etapas.forEach((e, ie) => {
      const ne = NUMS.etapa[ie];
      h.push(`<div class="lateral__etapa ${colorEtapa(ie)}">`);
      h.push(`<a class="lateral__cabeza" href="#hoja-${ne}" data-ir="hoja-${ne}">${ie + 1} · ${tx('titulo', e.titulo, { ruta: ie })}</a>`);
      h.push(`<div class="lateral__lista">`);
      e.bloques.forEach((b, ib) => {
        const n = NUMS.cap[`${ie}.${ib}`];
        h.push(`<a href="#hoja-${n}" data-ir="hoja-${n}" data-lat="${ie}.${ib}"><b>${ie + 1}.${ib + 1}</b>${tx('titulo', b.titulo, { ruta: `${ie}.${ib}` })}</a>`);
      });
      h.push(`</div></div>`);
    });
    if (DOC.cierre) {
      h.push(`<a class="lateral__cabeza lateral__cierre" href="#hoja-${NUMS.cierre}" data-ir="hoja-${NUMS.cierre}" data-lat="cierre">${tx('cierre.titulo', DOC.cierre.titulo)}</a>`);
    }
    h.push(`</aside>`);
    return h.join('');
  }

  function dibujar() {
    paginar();
    pintandoEdicion = edicion;
    const h = [`<div class="marco">`, PUBLICADO ? '' : lateral(), `<div class="hojas">`];   // publicado: sin índice lateral
    PAGINAS.forEach(p => h.push(hoja(p)));
    h.push(`</div></div>`);
    lienzo.innerHTML = h.join('');
    lienzo.classList.toggle('en-edicion', edicion);
    marcarActivo();
  }

  /* ── Índice lateral: qué hoja se está leyendo ───────────────────
     La última hoja cuyo borde superior ya pasó bajo la barra es la
     actual. Su etapa se despliega en el índice lateral. */
  function marcarActivo() {
    const lat = lienzo.querySelector('.lateral');
    if (!lat || getComputedStyle(lat).display === 'none') return;
    let actual = null;
    const marcas = lienzo.querySelectorAll('.hojas > .pagina:not([data-cap*="."]), .hojas > .pagina[data-cap$=".v"], .hojas [data-seg]');
    for (const p of marcas) {
      if (p.getBoundingClientRect().top < 160) actual = p; else break;
    }
    const cap = actual ? (actual.dataset.seg || actual.dataset.cap) : 'portada';
    lat.querySelectorAll('[aria-current]').forEach(a => a.removeAttribute('aria-current'));
    const enlace = lat.querySelector(`[data-lat="${cap}"]`);
    if (enlace) enlace.setAttribute('aria-current', 'true');
    const m = /^(\d+)\./.exec(cap);
    const etapa = m ? +m[1] : -1;
    lat.querySelectorAll('.lateral__etapa').forEach((el, i) => el.classList.toggle('abierta', i === etapa));
  }
  let pendiente = 0;
  const alMover = () => {
    if (pendiente) return;
    pendiente = requestAnimationFrame(() => { pendiente = 0; marcarActivo(); });
  };
  window.addEventListener('scroll', alMover, { passive: true });
  window.addEventListener('resize', alMover);

  /* ═══ 6 · LEER Y ESCRIBIR ══════════════════════════════════════════ */
  function enRuta(ruta) {
    if (ruta == null) return null;
    if (String(ruta).startsWith('c.')) return DOC.cierre.bifurcaciones[+String(ruta).slice(2)];
    const p = String(ruta).split('.').map(Number);
    let o = DOC.etapas[p[0]];
    if (o && p.length > 1) o = o.bloques[p[1]];
    if (o && p.length > 2) o = o.puntos[p[2]];
    return o;
  }

  /* Se lee innerText y no innerHTML: lo que se pega desde Word trae
     marcado que no queremos guardar. */
  /* Un texto con negrita o código vuelve a su marca (**…**, `…`) para
     no perder el formato al editarlo. */
  function aMarcado(nodo) {
    let t = '';
    nodo.childNodes.forEach(n => {
      if (n.nodeType === 3) { t += n.nodeValue; return; }
      if (n.nodeType !== 1) return;
      const dentro = aMarcado(n), etiqueta = n.nodeName;
      if (etiqueta === 'B' || etiqueta === 'STRONG') t += dentro.trim() ? '**' + dentro + '**' : dentro;
      else if (etiqueta === 'CODE') t += dentro.trim() ? '`' + dentro + '`' : dentro;
      else if (etiqueta === 'A' && n.getAttribute('href')) t += '[' + dentro + '](' + n.getAttribute('href') + ')';
      else if (etiqueta === 'BR') t += ' ';
      else t += dentro;
    });
    return t;
  }

  function recoger(el) {
    const bruto = el.dataset.rico ? aMarcado(el) : el.innerText;
    const texto = bruto.replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
    const campo = el.dataset.campo;
    if (el.dataset.ruta == null) {
      if (campo === 'cierre.titulo') DOC.cierre.titulo = texto;
      else if (campo === 'cierre.nota') DOC.cierre.nota = texto;
      else if (campo.startsWith('meta.')) (DOC.meta || [])[+campo.slice(5)] = texto;
      else DOC[campo] = texto;
      return;
    }
    const o = enRuta(el.dataset.ruta);
    if (o) o[campo] = texto;
  }

  /* El mismo texto en todas partes mientras se escribe: un título que
     se cambia en el índice cambia también en su hoja y en el lateral. */
  const gemelos = el => {
    const campo = el.dataset.campo, ruta = el.dataset.ruta;
    const sel = ruta != null ? `[data-campo="${campo}"][data-ruta="${ruta}"]` : `[data-campo="${campo}"]:not([data-ruta])`;
    return [...lienzo.querySelectorAll(sel)].filter(o => o !== el);
  };
  lienzo.addEventListener('input', ev => {
    const el = ev.target.closest('[contenteditable="true"]');
    if (!el || el.dataset.rico) return;
    gemelos(el).forEach(o => { o.textContent = el.innerText; });
  });
  lienzo.addEventListener('focusout', ev => {
    const el = ev.target.closest('[contenteditable="true"]');
    if (el) { recoger(el); decir('Cambios sin guardar'); }
  });
  lienzo.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && ev.target.isContentEditable) { ev.preventDefault(); ev.target.blur(); }
    if (ev.key === 'Escape' && ev.target.isContentEditable) ev.target.blur();
  });

  /* ═══ 7 · NAVEGAR, AGREGAR, QUITAR Y MOVER ═════════════════════════ */
  const ir = id => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });

  lienzo.addEventListener('click', ev => {
    /* En modo edición, un clic sobre un texto es para escribirlo, no
       para saltar a otra hoja. */
    if (edicion && ev.target.closest('[contenteditable="true"]')) {
      if (ev.target.closest('a')) ev.preventDefault();
      return;
    }
    const salto = ev.target.closest('[data-ir]');
    if (salto) { ev.preventDefault(); ir(salto.dataset.ir); return; }

    const mv = ev.target.closest('[data-mover]');
    const q  = ev.target.closest('[data-quitar]');
    const a  = ev.target.closest('[data-sumar]');
    const ins = ev.target.closest('[data-insertar]');
    if (!mv && !q && !a && !ins) return;
    const vivo = lienzo.querySelector('[contenteditable="true"]:focus');
    if (vivo) recoger(vivo);

    if (ins) {
      const r = ins.dataset.insertar.split('.').map(Number);
      anterior = JSON.stringify(DOC);
      DOC.etapas[r[0]].bloques[r[1]].puntos.splice(r[2] + 1, 0, { t: '', n: '' });
      dibujar();
      $('#b-deshacer').hidden = false;
      decir('Cambios sin guardar');
      const foco = lienzo.querySelector(`.hojas [data-ruta="${r[0]}.${r[1]}.${r[2] + 1}"][data-campo="t"]`);
      if (foco) foco.focus();
      return;
    }

    /* ── Mover: intercambia con el vecino y deja la flecha bajo el
       cursor, para poder seguir moviendo con clics seguidos. */
    if (mv) {
      if (mv.disabled) return;
      const tipo = mv.dataset.mover, dir = +mv.dataset.dir;
      const r = String(mv.dataset.ruta).split('.').map(Number);
      let lista, i;
      if (tipo === 'punto')  { lista = DOC.etapas[r[0]].bloques[r[1]].puntos; i = r[2]; }
      if (tipo === 'bloque') { lista = DOC.etapas[r[0]].bloques; i = r[1]; }
      if (tipo === 'etapa')  { lista = DOC.etapas; i = r[0]; }
      if (tipo === 'bif')    { lista = DOC.cierre.bifurcaciones; i = r[0]; }
      const j = i + dir;
      if (!lista) return;
      let nueva;
      if (j >= 0 && j < lista.length) {
        anterior = JSON.stringify(DOC);
        [lista[i], lista[j]] = [lista[j], lista[i]];
        nueva = tipo === 'punto' ? `${r[0]}.${r[1]}.${j}` : tipo === 'bloque' ? `${r[0]}.${j}` : String(j);
      } else if (tipo === 'punto') {
        /* Pasa al capítulo vecino: al final si sube, al inicio si baja. */
        const v = capVecino(r[0], r[1], dir);
        if (!v) return;
        anterior = JSON.stringify(DOC);
        const [p] = lista.splice(i, 1);
        const destino = DOC.etapas[v[0]].bloques[v[1]].puntos;
        if (dir < 0) destino.push(p); else destino.unshift(p);
        nueva = `${v[0]}.${v[1]}.${dir < 0 ? destino.length - 1 : 0}`;
      } else if (tipo === 'bloque') {
        /* Pasa a la etapa vecina: al final si sube, al inicio si baja. */
        const e2 = r[0] + dir;
        if (e2 < 0 || e2 >= DOC.etapas.length) return;
        anterior = JSON.stringify(DOC);
        const [b] = lista.splice(i, 1);
        const destino = DOC.etapas[e2].bloques;
        if (dir < 0) destino.push(b); else destino.unshift(b);
        nueva = `${e2}.${dir < 0 ? destino.length - 1 : 0}`;
      } else return;
      const ancla = mv.getBoundingClientRect().top;
      dibujar();
      const otra = lienzo.querySelector(`.hojas [data-mover="${tipo}"][data-ruta="${nueva}"][data-dir="${dir}"]`);
      if (otra) { window.scrollBy(0, otra.getBoundingClientRect().top - ancla); otra.focus({ preventScroll: true }); }
      $('#b-deshacer').hidden = false;
      decir('Cambios sin guardar');
      return;
    }

    anterior = JSON.stringify(DOC);
    if (q) {
      const r = String(q.dataset.ruta).split('.').map(Number);
      if (q.dataset.quitar === 'etapa')  DOC.etapas.splice(r[0], 1);
      if (q.dataset.quitar === 'bloque') DOC.etapas[r[0]].bloques.splice(r[1], 1);
      if (q.dataset.quitar === 'punto')  DOC.etapas[r[0]].bloques[r[1]].puntos.splice(r[2], 1);
      if (q.dataset.quitar === 'bif')    DOC.cierre.bifurcaciones.splice(r[0], 1);
    }
    let r = [];
    if (a) {
      r = String(a.dataset.ruta || '').split('.').map(Number);
      if (a.dataset.sumar === 'etapa')  DOC.etapas.push({ titulo: 'Etapa nueva', nota: '', bloques: [] });
      if (a.dataset.sumar === 'bloque') DOC.etapas[r[0]].bloques.push({ titulo: 'Capítulo nuevo', puntos: [{ t: '', n: '' }] });
      if (a.dataset.sumar === 'punto')  DOC.etapas[r[0]].bloques[r[1]].puntos.push({ t: '', n: '' });
      if (a.dataset.sumar === 'bif')    DOC.cierre.bifurcaciones.push({ titulo: 'Decisión nueva', texto: '' });
    }
    dibujar();
    $('#b-deshacer').hidden = !edicion;
    decir('Cambios sin guardar');
    if (a) {
      let foco = null;
      if (a.dataset.sumar === 'punto') {
        const ult = DOC.etapas[r[0]].bloques[r[1]].puntos.length - 1;
        foco = lienzo.querySelector(`.hojas [data-ruta="${r[0]}.${r[1]}.${ult}"][data-campo="t"]`);
      }
      if (a.dataset.sumar === 'bloque') foco = lienzo.querySelector(`.hojas h3 [data-ruta="${r[0]}.${DOC.etapas[r[0]].bloques.length - 1}"][data-campo="titulo"]`);
      if (a.dataset.sumar === 'etapa')  foco = lienzo.querySelector(`.hojas .etapa__banda [data-ruta="${DOC.etapas.length - 1}"][data-campo="titulo"]`);
      if (a.dataset.sumar === 'bif')    foco = lienzo.querySelector(`.hojas .bif [data-ruta="c.${DOC.cierre.bifurcaciones.length - 1}"][data-campo="titulo"]`);
      if (foco) foco.focus();
    }
  });

  /* ═══ 7b · BUSCAR Y REEMPLAZAR ════════════════════════════════════
     Cambia un texto en todo el documento de una vez: títulos, puntos,
     notas, rótulos, índice y pie. Distingue mayúsculas, para no tocar
     un nombre propio por error. «Deshacer» revierte el reemplazo. */
  function campos(o, fn) {
    if (Array.isArray(o)) { o.forEach((v, i) => typeof v === 'string' ? fn(o, i) : campos(v, fn)); return; }
    if (o && typeof o === 'object') {
      for (const k in o) {
        if (k === 'logo') continue;
        if (typeof o[k] === 'string') fn(o, k); else campos(o[k], fn);
      }
    }
  }
  const contar = buscar => {
    if (!buscar) return 0;
    let n = 0;
    campos(DOC, (o, k) => { n += o[k].split(buscar).length - 1; });
    return n;
  };

  function armarReemplazo() {
    if (PUBLICADO || $('#b-reemplazar')) return;   // publicado: sin reemplazo; guardado: ya lo trae
    const barra = $('.barra');
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'b-reemplazar'; b.hidden = true;
    b.setAttribute('aria-expanded', 'false'); b.textContent = 'Reemplazar';
    barra.insertBefore(b, $('#b-guardar'));
    const panel = document.createElement('div');
    panel.id = 'reemplazo'; panel.className = 'reemplazo'; panel.hidden = true;
    panel.innerHTML = `<label>Buscar <input type="text" id="r-buscar" autocomplete="off"></label>`
      + `<label>Reemplazar por <input type="text" id="r-por" autocomplete="off"></label>`
      + `<span id="r-cuenta" class="reemplazo__cuenta"></span>`
      + `<button type="button" id="r-todo">Reemplazar todo</button>`;
    barra.appendChild(panel);
  }
  armarReemplazo();
  const actualizarCuenta = () => {
    const n = contar($('#r-buscar').value);
    $('#r-cuenta').textContent = $('#r-buscar').value ? (n === 1 ? '1 coincidencia' : n + ' coincidencias') : '';
  };
  if (!PUBLICADO) {
  $('#b-reemplazar').addEventListener('click', () => {
    const abrir = $('#reemplazo').hidden;
    $('#reemplazo').hidden = !abrir;
    $('#b-reemplazar').setAttribute('aria-expanded', String(abrir));
    if (abrir) { actualizarCuenta(); $('#r-buscar').focus(); }
  });
  $('#r-buscar').addEventListener('input', actualizarCuenta);
  $('#r-todo').addEventListener('click', () => {
    const buscar = $('#r-buscar').value, por = $('#r-por').value;
    const n = contar(buscar);
    if (!n) { decir('No hay coincidencias'); return; }
    const vivo = lienzo.querySelector('[contenteditable="true"]:focus');
    if (vivo) recoger(vivo);
    anterior = JSON.stringify(DOC);
    campos(DOC, (o, k) => { o[k] = o[k].split(buscar).join(por); });
    dibujar();
    $('#b-deshacer').hidden = false;
    actualizarCuenta();
    decir(n === 1 ? 'Se reemplazó 1 coincidencia' : 'Se reemplazaron ' + n + ' coincidencias');
  });
  }

  /* ═══ 8 · LA BARRA ═════════════════════════════════════════════════ */
  if ($('#b-indice')) $('#b-indice').addEventListener('click', () => ir('hoja-' + HOJA_INDICE));

  function cambiarModo(enEdicion) {
    const vivo = lienzo.querySelector('[contenteditable="true"]:focus');
    if (vivo) recoger(vivo);
    edicion = enEdicion;
    $('#b-editar').setAttribute('aria-pressed', String(edicion));
    $('#b-editar').textContent = edicion ? 'Terminar edición' : 'Editar';
    $('#b-deshacer').hidden = !edicion || !anterior;
    $('#b-reemplazar').hidden = !edicion;
    if (!edicion) { $('#reemplazo').hidden = true; $('#b-reemplazar').setAttribute('aria-expanded', 'false'); }
    dibujar();
  }
  if (!PUBLICADO) {
  $('#b-editar').addEventListener('click', () => {
    cambiarModo(!edicion);
    decir(edicion ? 'Modo edición' : '');
  });

  $('#b-deshacer').addEventListener('click', () => {
    if (!anterior) return;
    DOC = JSON.parse(anterior);
    anterior = null;
    $('#b-deshacer').hidden = true;
    dibujar();
    decir('Se deshizo el último cambio');
  });
  }

  /* Al imprimir desde el navegador, las hojas se rearman a su medida
     exacta: si estaba en modo edición, se termina antes. */
  window.addEventListener('beforeprint', () => { if (edicion) cambiarModo(false); });

  /* ═══ 9 · GUARDAR EN SU COMPUTADOR ═════════════════════════════════
     El archivo que baja es este mismo documento con los datos dentro:
     se abre con doble clic, sin internet y sin ninguna cuenta. Por eso
     la herramienta de PDF va incrustada y no se pide a un servidor. */
  /* Se arma pieza por pieza y en orden fijo, nunca barriendo el
     documento: alrededor de esta página hay código del visor que no es
     nuestro, y un querySelectorAll('script') se lo llevaría dentro del
     archivo de la persona. Eso además lo dejaría creyendo que sigue
     dentro del visor, y entonces no descargaría nada en su computador. */
  function documentoCompleto() {
    const reset = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);'
      + 'padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;'
      + 'background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}';
    const pieza = id => { const e = document.getElementById(id); return e ? e.outerHTML : ''; };
    const titulo = document.title || 'Estándar de cotizador ecommerce';

    const cuerpo =
        '<title>' + titulo + '<\/title>'
      + pieza('estilo')
      + '<div class="hoja">' + $('.barra').outerHTML.replace(/(id="aviso"[^>]*>)[^<]*/, '$1')
          .replace(/<button type="button" id="b-reemplazar"[^>]*>/, '<button type="button" id="b-reemplazar" hidden="" aria-expanded="false">')
          .replace(/<div id="reemplazo" class="reemplazo"[^>]*>/, '<div id="reemplazo" class="reemplazo" hidden="">')
      + '<div id="lienzo"></div></div>'
      + '<script type="application/json" id="datos-iniciales">'
      +   JSON.stringify(DOC).replace(/</g, '\\u003c') + '<\/script>'
      + pieza('motor-pdf')
      + pieza('logica');

    return '<!doctype html><html lang="es"><head><meta charset=utf8>'
         + '<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">'
         + '<style>' + reset + '</style></head><body>' + cuerpo + '</body></html>';
  }

  /* Dentro del visor se pide la descarga al anfitrión; en un computador
     cualquiera basta un enlace. Se intenta lo primero y se cae a lo
     segundo, así el mismo botón sirve en los dos lados. */
  async function bajar(nombre, datos, tipo) {
    if (enVisor) {
      try {
        const api = await window.claude.use('downloads');
        if (api) { await api.save({ filename: nombre, data: datos }); return true; }
      } catch (e) { /* se intenta el enlace */ }
    }
    const url = URL.createObjectURL(new Blob([datos], { type: tipo }));
    const a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  }

  /* ── Guardar como ──────────────────────────────────────────────
     Se abre la ventana de guardado del propio sistema, la de siempre:
     ella elige carpeta y nombre. Donde el navegador no la ofrezca, cae
     en una descarga normal con un nombre que lleva fecha y hora, así
     dos guardados nunca se pisan. */
  const sugerido = () => {
    const f = new Date();
    const dd = n => String(n).padStart(2, '0');
    return `Estandar-cotizador-${f.getFullYear()}-${dd(f.getMonth() + 1)}-${dd(f.getDate())}`
         + `-${dd(f.getHours())}${dd(f.getMinutes())}`;
  };

  async function guardarComo(nombre, datos, tipo, ext) {
    if (window.showSaveFilePicker) {
      try {
        const f = await window.showSaveFilePicker({
          suggestedName: nombre + ext,
          types: [{ description: ext === '.pdf' ? 'Documento PDF' : 'Página web',
                    accept: { [tipo]: [ext] } }]
        });
        const w = await f.createWritable();
        await w.write(datos); await w.close();
        return f.name;
      } catch (e) {
        if (e && e.name === 'AbortError') return null;   // canceló
      }
    }
    await bajar(nombre + ext, datos, tipo);
    return nombre + ext;
  }

  let ocupado = false;
  if (!PUBLICADO) $('#b-guardar').addEventListener('click', async () => {
    if (ocupado) return;
    const vivo = lienzo.querySelector('[contenteditable="true"]:focus');
    if (vivo) recoger(vivo);
    ocupado = true; decir('Guardando…');
    try {
      const n = await guardarComo(sugerido(),
        new TextEncoder().encode(documentoCompleto()), 'text/html', '.html');
      decir(n ? 'Guardado como ' + n : '');
    } catch (e) { decir('No se pudo guardar', true); }
    finally { ocupado = false; }
  });

  /* ═══ 10 · PDF ═════════════════════════════════════════════════════
     Texto de verdad, no una foto de la pantalla: pesa poco, se puede
     buscar y copiar. Sigue exactamente las mismas hojas que la
     pantalla: cada capítulo en su página, el índice con el número de
     cada una y enlaces que saltan a ella, y «Volver al índice» al pie. */
  function armarPDF() {
    dibujar();                       // paginación al día antes de armar
    const { jsPDF } = window.jspdf;
    const d = new jsPDF({ unit: 'mm', format: 'a4' });
    const AN = 210;                  // ancho de la hoja A4, en milímetros

    /* La tipografía del PDF solo escribe Latin-1: una flecha o una
       viñeta pegada desde Word saldría como un garabato. Se cambia por
       su equivalente, y lo que no tenga equivalente se descarta. */
    const CAMBIOS = {
      '→': '->', '←': '<-', '↔': '<->', '↳': '>', '⇒': '=>', '↑': '', '↓': '',
      '•': '·', '●': '·', '▪': '·', '–': '-', '—': '-', '―': '-', '‑': '-',
      '“': '"', '”': '"', '‘': "'", '’': "'", '…': '...',
      '≤': '<=', '≥': '>=', '≠': '!=', '✓': 'OK', '✔': 'OK', '✕': 'x', '✗': 'x'
    };
    const latin = t => t.replace(/[^\u0000-\u00ff]/g, c => CAMBIOS[c] || '');
    /* Color de pantalla a RGB; un color transparente no se dibuja. */
    const rgb = c => {
      const m = /rgba?\(([^)]+)\)/.exec(c || '');
      if (!m) return null;
      const v = m[1].split(',').map(x => parseFloat(x));
      return v.length > 3 && v[3] === 0 ? null : v.slice(0, 3);
    };
    /* En Arial y Helvetica la línea base queda al 81 % del alto de la
       letra (subida 0,905 sobre 1,117 de subida más bajada). */
    const BASE = 0.905 / 1.117;
    const enlaces = [];              // se agregan al final, con todas las hojas creadas

    /* Cada hoja se arma en la hoja invisible de medición, con las medidas
       exactas del papel, y se copia al PDF en el mismo lugar: fondos,
       líneas, vistos buenos, palabras y enlaces. Así el PDF es igual a
       la pantalla, con los mismos cortes y los mismos números de página. */
    const pintarHoja = (el, numero) => {
      const caja = el.getBoundingClientRect();
      const k = AN / caja.width;                     // milímetros por píxel
      const X = v => (v - caja.left) * k, Y = v => (v - caja.top) * k;
      const PT = px => px * k * 72 / 25.4;           // tamaño de letra: de píxel a punto

      /* 1 · Fondos, bordes, imágenes y vistos buenos, en el orden del documento. */
      [el, ...el.querySelectorAll('*')].forEach(n => {
        const cs = getComputedStyle(n);
        if (cs.display === 'none') return;
        const r = n.getBoundingClientRect();
        if (!r.width || !r.height) return;
        const fondo = rgb(cs.backgroundColor);
        if (fondo) {
          d.setFillColor(...fondo);
          const radio = (parseFloat(cs.borderTopLeftRadius) || 0) * k;
          if (radio > 0) d.roundedRect(X(r.left), Y(r.top), r.width * k, r.height * k, radio, radio, 'F');
          else d.rect(X(r.left), Y(r.top), r.width * k, r.height * k, 'F');
        }
        /* Cada borde se dibuja como una franja de su grosor. */
        [['Top', 0], ['Right', 1], ['Bottom', 2], ['Left', 3]].forEach(([lado, i]) => {
          const g = parseFloat(cs['border' + lado + 'Width']) || 0;
          const color = rgb(cs['border' + lado + 'Color']);
          if (!g || !color || cs['border' + lado + 'Style'] === 'none') return;
          d.setFillColor(...color);
          if (i === 0) d.rect(X(r.left), Y(r.top), r.width * k, g * k, 'F');
          if (i === 2) d.rect(X(r.left), Y(r.bottom - g), r.width * k, g * k, 'F');
          if (i === 3) d.rect(X(r.left), Y(r.top), g * k, r.height * k, 'F');
          if (i === 1) d.rect(X(r.right - g), Y(r.top), g * k, r.height * k, 'F');
        });
        if (n.tagName === 'IMG' && n.src) {
          try {
            const formato = /^data:image\/jpe?g/.test(n.src) ? 'JPEG' : 'PNG';
            d.addImage(n.src, formato, X(r.left), Y(r.top), r.width * k, r.height * k, 'img-' + n.src.length, 'FAST');
          } catch (e) {}
        }
        /* Visto bueno de cada punto: dos bordes girados en 45 grados,
           como en pantalla. Se calcula su forma y se traza. */
        if (n.tagName === 'LI') {
          const v = getComputedStyle(n, '::before');
          if (v.display !== 'none' && v.content !== 'none') {
            const w = parseFloat(v.width), h = parseFloat(v.height);
            const g = parseFloat(v.borderRightWidth) || 0;
            const izq = r.left + (parseFloat(cs.paddingLeft) || 0) + (parseFloat(v.marginLeft) || 0);
            const arr = r.top + (parseFloat(cs.paddingTop) || 0) + (parseFloat(v.marginTop) || 0);
            const cx = izq + (w + g) / 2, cy = arr + (h + g) / 2, c = Math.SQRT1_2;
            const gira = (x, y) => [cx + (x - cx) * c - (y - cy) * c, cy + (x - cx) * c + (y - cy) * c];
            const A = gira(izq, arr + h + g / 2), B = gira(izq + w + g / 2, arr + h + g / 2), C = gira(izq + w + g / 2, arr);
            d.setDrawColor(...(rgb(v.borderRightColor) || [33, 103, 174]));
            d.setLineWidth(g * k); d.setLineCap('butt'); d.setLineJoin('miter');
            d.lines([[(B[0] - A[0]) * k, (B[1] - A[1]) * k], [(C[0] - B[0]) * k, (C[1] - B[1]) * k]], X(A[0]), Y(A[1]), [1, 1], 'S', false);
          }
        }
      });

      /* 2 · Palabras: cada una en su lugar exacto, con su letra y color.
         Así se conservan los cortes de línea, la justificación y las
         negritas. Cada palabra lleva el espacio que la sigue en el texto,
         para que el PDF se pueda buscar y copiar sin palabras pegadas. */
      const palabras = [];
      const recorre = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const rango = document.createRange();
      let t;
      while ((t = recorre.nextNode())) {
        const txt = t.nodeValue;
        const cs = getComputedStyle(t.parentElement);
        if (cs.display === 'none') continue;
        const estilo = {
          fs: parseFloat(cs.fontSize),
          negrita: parseInt(cs.fontWeight, 10) >= 600 || cs.fontWeight === 'bold',
          mono: /Consolas|Courier|monospace/i.test(cs.fontFamily),
          mayus: cs.textTransform === 'uppercase',
          subraya: !!t.parentElement.closest('.enlace'),
          color: rgb(cs.color) || [0, 0, 0]
        };
        const re = /\s+|\S+/g;
        let m;
        while ((m = re.exec(txt))) {
          if (/^\s/.test(m[0])) { if (palabras.length) palabras[palabras.length - 1].espacio = true; continue; }
          rango.setStart(t, m.index); rango.setEnd(t, m.index + m[0].length);
          const rs = [...rango.getClientRects()].filter(q => q.width > 0);
          if (!rs.length) continue;
          if (rs.length === 1) { palabras.push({ p: m[0], q: rs[0], e: estilo }); continue; }
          /* Palabra larga cortada entre dos líneas: se dibuja por tramos. */
          let tramo = '', ref = null;
          for (let c = 0; c < m[0].length; c++) {
            rango.setStart(t, m.index + c); rango.setEnd(t, m.index + c + 1);
            const q = rango.getClientRects()[0];
            if (!q) continue;
            if (ref && Math.abs(q.top - ref.top) > 2) { palabras.push({ p: tramo, q: ref, e: estilo }); tramo = ''; ref = null; }
            if (!ref) ref = q;
            tramo += m[0][c];
          }
          if (tramo) palabras.push({ p: tramo, q: ref, e: estilo });
        }
      }
      palabras.forEach(({ p, q, e, espacio }) => {
        const texto = latin(e.mayus ? p.toUpperCase() : p);
        if (!texto) return;
        d.setFont(e.mono ? 'courier' : 'helvetica', e.negrita ? 'bold' : 'normal');
        d.setFontSize(PT(e.fs)); d.setTextColor(...e.color);
        const base = q.top + q.height * BASE;
        d.text(texto + (espacio ? ' ' : ''), X(q.left), Y(base));
        if (e.subraya) {
          d.setDrawColor(...e.color); d.setLineWidth(e.fs * k / 16);
          d.line(X(q.left), Y(base + e.fs * 0.12), X(q.right), Y(base + e.fs * 0.12));
        }
      });

      /* 3 · Enlaces: índice, «Volver al índice» y direcciones externas. */
      el.querySelectorAll('a[href]').forEach(a => {
        const destino = a.getAttribute('href');
        const hoja = /^#hoja-(\d+)$/.exec(destino);
        if (!hoja && !/^(https?:|mailto:)/.test(destino)) return;
        [...a.getClientRects()].filter(q => q.width > 0).forEach(q => enlaces.push({
          numero, x: X(q.left), y: Y(q.top), w: q.width * k, h: q.height * k,
          op: hoja ? { pageNumber: +hoja[1] } : { url: destino }
        }));
      });
    };

    const modo = pintandoEdicion;
    pintandoEdicion = false;         // se dibuja como se imprime, sin controles de edición
    try {
      PAGINAS.forEach((pg, i) => {
        if (i > 0) d.addPage();
        medidor.innerHTML = hoja(pg);
        pintarHoja(medidor.querySelector('.pagina'), i + 1);
      });
    } finally {
      medidor.innerHTML = '';
      pintandoEdicion = modo;
    }
    enlaces.forEach(e => { d.setPage(e.numero); d.link(e.x, e.y, e.w, e.h, e.op); });
    return d;
  }

  if ($('#b-pdf')) $('#b-pdf').addEventListener('click', async () => {
    if (ocupado) return;
    const vivo = lienzo.querySelector('[contenteditable="true"]:focus');
    if (vivo) recoger(vivo);
    ocupado = true; decir('Armando el PDF…');
    try {
      const bytes = armarPDF().output('arraybuffer');
      const n = await guardarComo(sugerido(), new Uint8Array(bytes), 'application/pdf', '.pdf');
      decir(n ? 'PDF guardado como ' + n : '');
    } catch (e) { decir('No se pudo armar el PDF', true); }
    finally { ocupado = false; }
  });

  /* ═══ 11 · ARRANQUE ════════════════════════════════════════════════ */
  dibujar();
  decir('');
  if (!PUBLICADO) {
    $('#b-guardar').hidden = false;
    /* Siempre abre en lectura, aunque se haya guardado en modo edición. */
    $('#b-editar').textContent = 'Editar';
    $('#b-editar').setAttribute('aria-pressed', 'false');
  }
  if (window.jspdf && $('#b-pdf')) $('#b-pdf').hidden = false;

  if (PUBLICADO) {
    document.documentElement.classList.add('publicado');
    /* Las hojas se agrandan hasta el ancho de la barra superior: la hoja
       mide 794 px y el contenedor llega a 1240 px (máximo 160 %). */
    const ajustar = () => {
      const ancho = $('.hojas') ? $('.hojas').clientWidth : window.innerWidth - 40;
      const z = window.innerWidth > 880 ? Math.min(1.6, Math.max(1, ancho / 794)) : 1;
      document.documentElement.style.setProperty('--zoom-hojas', z.toFixed(3));
    };
    ajustar();
    window.addEventListener('resize', ajustar);
    /* Botón «Volver arriba»: aparece al bajar y lleva al inicio del documento. */
    const arriba = document.createElement('button');
    arriba.type = 'button'; arriba.className = 'arriba'; arriba.hidden = true;
    arriba.textContent = '↑ Volver arriba';
    arriba.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    document.body.appendChild(arriba);
    const mostrar = () => { arriba.hidden = window.scrollY < 600; };
    window.addEventListener('scroll', mostrar, { passive: true });
    mostrar();
  }
})();
</script></body></html>
