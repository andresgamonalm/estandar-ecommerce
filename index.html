<!doctype html><html lang="es"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Estándar de cotizador ecommerce</title><style id="estilo">
  /* ═══════════════════════════════════════════════════════════════════
     ESTÁNDAR DEL COTIZADOR · HOJA DE ESTILO
     El documento se ve como hojas A4, una tras otra, igual en pantalla
     que impreso: cada hoja de la pantalla es una página del papel.
     Cada capítulo parte en una hoja nueva. Todo se dibuja desde los
     datos: al mover, agregar o borrar algo, las hojas y los números de
     página del índice se rehacen solos.

     Tipografía Arial: el documento se abre en cualquier equipo, sin
     internet y sin la fuente corporativa instalada.
     ═══════════════════════════════════════════════════════════════════ */
  :root {
    color-scheme: light;

    /* ── Paleta de marca ──────────────────────────────────────────── */
    --azul:      #2167AE;   /* Azul de Zúrich, color héroe: franja, filetes, botones */
    --azul-osc:  #23366F;   /* Azul oscuro: el único azul de todo el texto */
    --paloma:    #DDE4E3;   /* Paloma: fondo gris de las sugerencias y recuadros */
    --papel:     #FFFFFF;   /* Fondo de cada hoja */
    --fondo:     #ECEEEF;   /* Gris de pantalla alrededor de las hojas; no se imprime */
    --tinta:     #23366F;   /* Color del texto */
    --tinta-2:   #5A6676;   /* Gris de notas, descripciones y pie */
    --linea:     #D3DADF;   /* Filetes finos de separación */
    --borrar:    #8C4A42;   /* Botón «quitar» al pasar el cursor */

    /* ── Destacados por sección (colores de Zurich) ────────────────────
       Cada sección tiene un color que marca su banda, el número de sus
       capítulos y su entrada en los índices. El texto encima es blanco
       sobre los azules y casi negro sobre los claros; así no hay azul
       sobre verde. */
    --acento-etapa-1: #2167AE;   /* Azul de Zurich · Proyecto · texto blanco 5,8 : 1 */
    --acento-etapa-2: #23366F;   /* Azul oscuro · Experiencia · texto blanco 11,5 : 1 */
    --acento-etapa-3: #A6E9AB;   /* Menta · Ejecución · texto casi negro 13,4 : 1 */
    --acento-etapa-4: #FF7569;   /* Durazno · Medición · texto casi negro 7,2 : 1 */
    --acento-etapa-5: #FFF773;   /* Amarillo · Software adicionales · texto casi negro 16,9 : 1 */
    --texto-sobre-azul: #FFFFFF;   /* texto sobre los destacados azules */
    --texto-sobre-claro: #111111;  /* texto sobre los destacados claros */

    /* ── Escala de letra: todos los tamaños salen de aquí ─────────── */
    --letra-11px: 11px;   /* meta de portada y pie de cada hoja */
    --letra-12px: 12px;   /* rótulos, notas de cada punto, avisos, «volver» */
    --letra-13px: 13px;   /* índices, ayuda, botones, descripción de etapa */
    --letra-14px: 14px;   /* puntos y párrafos */
    --letra-16px: 16px;   /* entrada de portada y título de cada capítulo */
    --letra-20px: 20px;   /* título de cada etapa y del cierre */
    --letra-28px: 28px;   /* título de portada en teléfono */
    --letra-40px: 40px;   /* título de portada en la hoja */

    /* ── Interlineado ─────────────────────────────────────────────── */
    --interlineado-1-2: 1.2;     /* títulos */
    --interlineado-1-35: 1.35;   /* índices y rótulos */
    --interlineado-1-5: 1.5;     /* texto corrido */

    /* ── Medidas de la hoja (A4) ──────────────────────────────────── */
    --hoja-ancho: 210mm;       /* ancho de la hoja */
    --hoja-alto: 297mm;        /* alto de la hoja */
    --franja-alto: 14mm;       /* franja azul de arriba */
    --pie-alto: 12mm;          /* pie con «volver», texto y número */
    --margen-lateral: 16mm;    /* margen izquierdo y derecho del texto */

    --letra: Arial, Helvetica, sans-serif;
  }

  body {
    margin: 0; background: var(--fondo); color: var(--tinta);
    font-family: var(--letra); font-size: var(--letra-14px); line-height: var(--interlineado-1-5);
    -webkit-font-smoothing: antialiased;
  }
  /* Envoltura de toda la pantalla: barra, índice lateral y hojas. */
  .hoja { hyphens: auto; -webkit-hyphens: auto; max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 0 64px; }

  /* ── Barra de herramientas (fija arriba, no se imprime) ─────────── */
  .barra {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: var(--fondo); border-bottom: 2px solid var(--azul);
    padding: 10px 0; margin-bottom: 22px;
  }
  .barra button {
    font-family: var(--letra); font-size: var(--letra-13px); font-weight: bold;
    border: 1px solid var(--azul); background: var(--papel); color: var(--azul);
    border-radius: 2px; padding: 8px 14px; cursor: pointer;
  }
  .barra button:hover { background: var(--azul); color: #FFFFFF; }
  .barra button:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
  .barra button[aria-pressed="true"] { background: var(--azul); color: #FFFFFF; }
  .barra button.principal { background: var(--azul); color: #FFFFFF; }
  .barra button.principal:hover { background: var(--azul-osc); border-color: var(--azul-osc); }
  .barra__aviso { font-size: var(--letra-12px); color: var(--tinta-2); margin-left: auto; }
  .barra__aviso[data-mal="1"] { color: var(--borrar); font-weight: bold; }
  .barra button[aria-expanded="true"] { background: var(--azul); color: #FFFFFF; }

  /* Buscar y reemplazar: fila completa bajo los botones (modo edición). */
  .reemplazo { flex: 1 0 100%; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-top: 4px; }
  .reemplazo[hidden] { display: none; }
  /* Con el panel abierto la barra crece: el índice lateral baja con ella. */
  .hoja:has(.reemplazo:not([hidden])) .lateral { top: 128px; }
  .reemplazo label { display: flex; gap: 6px; align-items: center; font-size: var(--letra-13px); font-weight: bold; color: var(--azul-osc); }
  .reemplazo input {
    font-family: var(--letra); font-size: var(--letra-13px); color: var(--tinta);
    border: 1px solid var(--linea); border-radius: 2px; padding: 7px 9px; width: 220px; background: var(--papel);
  }
  .reemplazo input:focus { outline: 2px solid var(--azul); outline-offset: 1px; }
  .reemplazo__cuenta { font-size: var(--letra-12px); color: var(--tinta-2); min-width: 110px; }

  /* ── Ayuda de uso (solo pantalla) ───────────────────────────────── */
  .ayuda {
    width: var(--hoja-ancho); box-sizing: border-box;
    background: var(--papel); border-top: 2px solid var(--azul); border-radius: 2px;
    padding: 12px 15px; font-size: var(--letra-13px); line-height: var(--interlineado-1-5);
  }
  .ayuda ol { margin: 7px 0 0; padding-left: 19px; }
  .ayuda li { margin-bottom: 3px; text-align: justify; }

  /* ── Marco: índice lateral a la izquierda y hojas a la derecha ─────
     El índice lateral aparece solo en pantallas anchas y altas, donde
     cabe entero sin barra de desplazamiento propia. */
  .marco { display: block; }
  .lateral { display: none; }
  .hojas { display: flex; flex-direction: column; align-items: center; gap: 24px; min-width: 0; }
  @media screen and (min-width: 1180px) and (min-height: 700px) {
    .marco { display: grid; grid-template-columns: 270px var(--hoja-ancho); column-gap: 44px; justify-content: center; align-items: start; }
    .lateral { display: block; position: sticky; top: 76px; }   /* justo bajo la barra fija */
  }
  .lateral__titulo {
    display: block; font-size: var(--letra-13px); font-weight: bold; color: var(--azul-osc); text-decoration: none;
    margin: 0 0 10px; padding-bottom: 8px; border-bottom: 2px solid var(--azul);
  }
  .lateral__etapa { margin-bottom: 6px; }
  /* Cabeza de cada etapa, con el color de su etapa de fondo. */
  .lateral__cabeza {
    display: block; text-decoration: none; background: var(--acento); color: var(--acento-texto);
    border-radius: 2px; padding: 6px 10px; font-size: var(--letra-13px); font-weight: bold;
    line-height: var(--interlineado-1-35);
  }
  .lateral__cierre { background: var(--paloma); margin-top: 4px; }
  .lateral a:hover .tx { text-decoration: underline; }
  .lateral a:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
  .lateral [aria-current="true"] .tx { text-decoration: underline; }
  /* Solo se despliega la lista de la etapa que se está leyendo. */
  .lateral__lista { display: none; padding: 6px 0 6px 4px; }
  .lateral__etapa.abierta .lateral__lista { display: block; }
  .lateral__lista a {
    display: flex; gap: 8px; padding: 2px 0 2px 10px;
    font-size: var(--letra-13px); line-height: var(--interlineado-1-35);
    color: var(--tinta); text-decoration: none; border-left: 2px solid var(--linea);
  }
  .lateral__lista a b { min-width: 2.6em; flex: none; }
  /* El capítulo que se está leyendo: filete azul y negrita. */
  .lateral__lista a[aria-current="true"] { border-left-color: var(--azul); font-weight: bold; }
  .lateral__lista a[aria-current="true"] .tx { text-decoration: none; }

  /* Cada etapa toma su color de acento. */
  .etapa--1 { --acento: var(--acento-etapa-1); --acento-texto: var(--texto-sobre-azul); }
  .etapa--2 { --acento: var(--acento-etapa-2); --acento-texto: var(--texto-sobre-azul); }
  .etapa--3 { --acento: var(--acento-etapa-3); --acento-texto: var(--texto-sobre-claro); }
  .etapa--4 { --acento: var(--acento-etapa-4); --acento-texto: var(--texto-sobre-claro); }
  .etapa--5 { --acento: var(--acento-etapa-5); --acento-texto: var(--texto-sobre-claro); }

  /* ═══ LA HOJA ══════════════════════════════════════════════════════
     Franja azul arriba, cuerpo al medio y pie abajo. El alto es fijo:
     lo que no cabe pasa a una hoja de continuación, nunca se corta. */
  .pagina {
    width: var(--hoja-ancho); height: var(--hoja-alto); box-sizing: border-box;
    background: var(--papel); display: flex; flex-direction: column; overflow: hidden;
    scroll-margin-top: 76px;
  }
  .pagina__franja {
    flex: none; height: var(--franja-alto); box-sizing: border-box;
    display: flex; align-items: center; gap: 16px;
    padding: 0 var(--margen-lateral); background: var(--azul); color: #FFFFFF;
  }
  .franja__logo { height: 26px; flex: none; display: block; }
  .franja__barra { width: 1px; height: 22px; background: #FFFFFF; flex: none; }
  .franja__area { font-size: var(--letra-13px); }
  .franja__firma { margin-left: auto; font-size: var(--letra-12px); }
  .franja__firma a { color: #FFFFFF; text-decoration: none; }   /* enlazada al correo, sin subrayado */

  .pagina__cuerpo { flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 9mm var(--margen-lateral) 1mm; }   /* 1 mm libre sobre el pie */

  .pagina__pie { flex: none; height: var(--pie-alto); box-sizing: border-box; padding: 0 var(--margen-lateral); }
  .pagina__pie > div {
    height: 100%; border-top: 1px solid var(--linea);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    font-size: var(--letra-11px); color: var(--tinta-2);
  }
  .pie__der { text-align: right; font-variant-numeric: tabular-nums; }
  /* «Volver al índice»: enlace al pie de cada capítulo; funciona también en el PDF. */
  .volver { font-size: var(--letra-12px); font-weight: bold; color: var(--azul-osc); text-decoration: none; }
  .volver:hover .tx { text-decoration: underline; }

  /* ── Portada ────────────────────────────────────────────────────── */
  .cabecera { padding-top: 26mm; }
  .ojo { font-size: var(--letra-12px); font-weight: bold; color: var(--azul-osc); text-transform: uppercase; margin: 0 0 10px; }
  h1 {
    font-family: var(--letra); font-weight: bold; font-size: var(--letra-40px);
    line-height: var(--interlineado-1-2); margin: 0 0 18px; color: var(--azul-osc); text-wrap: balance;
  }
  .regla { width: 118px; height: 3px; background: var(--azul); margin: 0 0 20px; }
  .entrada { font-size: var(--letra-16px); line-height: var(--interlineado-1-5); margin: 0 0 22px; text-align: justify; }
  .meta { font-size: var(--letra-11px); color: var(--tinta-2); line-height: var(--interlineado-1-5); margin: 0 0 16px; }
  .leyenda { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: var(--letra-12px); margin: 0; }
  .leyenda__muestra { background: var(--paloma); padding: 4px 9px; border-radius: 2px; font-weight: bold; }

  /* ── Índice ─────────────────────────────────────────────────────── */
  .indice h2 {
    font-size: var(--letra-16px); font-weight: bold; color: var(--azul-osc); line-height: var(--interlineado-1-2);
    margin: 0 0 10px; padding-bottom: 7px; border-bottom: 2px solid var(--azul);
  }
  .indice__etapa { margin-bottom: 7px; }   /* aire entre secciones del índice */
  .indice__cabeza {
    display: inline-block; background: var(--acento); color: var(--acento-texto); text-decoration: none;
    font-size: var(--letra-13px); font-weight: bold; line-height: var(--interlineado-1-35);
    padding: 4px 10px; border-radius: 2px; margin: 0 0 4px;
  }
  .indice__nota { font-size: var(--letra-13px); color: var(--tinta-2); margin: 0 0 3px; text-align: justify; }
  /* Los capítulos de cada etapa van en una sola columna, en orden. */
  .indice__lista { }
  .indice__fila {
    display: flex; gap: 9px; align-items: baseline; break-inside: avoid;
    font-size: var(--letra-13px); line-height: var(--interlineado-1-35);
    color: var(--tinta); text-decoration: none; padding: 1px 0; border-bottom: 1px solid var(--linea);   /* 1 px de relleno arriba y abajo */
  }
  .indice__fila b { min-width: 2.6em; flex: none; }
  .indice__fila .tx { flex: 1 1 auto; min-width: 0; }
  /* Número de la hoja donde empieza el capítulo. */
  .indice__fila i { font-style: normal; flex: none; min-width: 2em; text-align: right; color: var(--tinta-2); font-variant-numeric: tabular-nums; }
  .indice__cierre { font-weight: bold; margin-top: 4px; }
  .indice a:hover .tx { text-decoration: underline; }
  .indice a:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
  .continua { font-size: var(--letra-12px); font-weight: normal; color: var(--tinta-2); flex: none; }

  /* ── Etapa y capítulo ───────────────────────────────────────────── */
  .etapa__banda {
    display: flex; align-items: baseline; gap: 4px 14px; flex-wrap: wrap;
    background: var(--acento); color: var(--acento-texto);
    padding: 12px 16px; border-radius: 2px; margin-bottom: 18px;
  }
  .etapa__n { font-size: var(--letra-12px); font-weight: bold; }
  .etapa__banda h2 { font-family: var(--letra); font-weight: bold; font-size: var(--letra-20px); margin: 0; line-height: var(--interlineado-1-2); }
  /* La descripción va en su propia línea, a todo el ancho de la banda. */
  .etapa__banda p { margin: 0; font-size: var(--letra-13px); flex: 1 1 100%; min-width: 0; text-align: justify; }

  .bloque { border-top: 2px solid var(--azul); padding-top: 10px; }   /* filete azul y 10 px hasta el título */
  /* Capítulo que viene de la hoja anterior: la lista sigue, sin título. */
  .bloque--sigue { border-top: 0; padding-top: 0; }
  /* Capítulos seguidos dentro de la misma hoja: aire entre uno y otro. */
  .bloque + .bloque { margin-top: 22px; }   /* separación entre capítulos */
  .bloque h3 {
    font-family: var(--letra); font-weight: bold; font-size: var(--letra-16px);
    line-height: var(--interlineado-1-35); margin: 0 0 9px; padding-bottom: 7px;   /* 7 px hasta la línea fina y 9 px hasta el primer punto */
    border-bottom: 1px solid var(--linea);
    display: flex; gap: 10px; align-items: center; color: var(--azul-osc);
  }
  /* Número del capítulo, sobre el color de su etapa. */
  .num {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    min-width: 38px; padding: 3px 7px; border-radius: 2px;
    background: var(--acento); color: var(--acento-texto);
    font-size: var(--letra-13px); font-weight: bold; line-height: var(--interlineado-1-2);
    font-variant-numeric: tabular-nums;
  }
  .bloque h3 > .tx { flex: 1 1 auto; min-width: 0; }

  /* Los puntos van en una sola columna: se leen de arriba abajo, en orden. */
  .bloque ul { list-style: none; margin: 0; padding: 0; }
  .bloque li {
    display: flex; gap: 10px; min-width: 0; margin: 0 0 6px;   /* 6 px de aire entre un punto y el siguiente */
    font-size: var(--letra-14px); line-height: var(--interlineado-1-5); break-inside: avoid;
  }
  .bloque li:last-child { margin-bottom: 0; }   /* el último punto no suma aire: el filete del capítulo siguiente ya separa */
  .bloque li > .cuerpo { min-width: 0; flex: 1 1 auto; }
  .bloque li .tx { overflow-wrap: anywhere; text-align: justify; }
  /* Viñeta: visto bueno en azul, dibujado con dos bordes girados. */
  .bloque li::before {
    content: ''; flex: none; box-sizing: content-box; width: 5px; height: 11px; margin: 2px 4px 0 3px;
    border: solid var(--azul); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
  }
  .bloque li b { font-weight: bold; }
  /* Enlace dentro de un punto: mismo color del texto, subrayado. */
  .enlace { color: inherit; text-decoration: underline; }
  .dato { display: block; font-size: var(--letra-12px); color: var(--tinta-2); margin-top: 3px; }
  code { font-family: Consolas, 'Courier New', monospace; font-size: var(--letra-13px); color: var(--azul-osc); white-space: nowrap; }
  /* Las notas con ejemplos van a la izquierda: justificadas, los
     identificadores quedarían separados por huecos. */
  .bloque li .dato { text-align: left; }

  /* ── Sugerencias para otras áreas ──────────────────────────────────
     Lo que corresponde a otra área va sobre gris Paloma, con el nombre
     del área. Lo que define Ecommerce va sobre blanco. */
  .sugiere { display: block; font-size: var(--letra-12px); line-height: var(--interlineado-1-35); color: var(--azul-osc); margin: 0 0 4px; }
  .bloque li .sugiere .tx, .sugiere .tx { text-align: left; }
  .sugiere__area { font-weight: bold; }
  .sugiere--bloque { background: var(--paloma); padding: 8px 12px; border-radius: 2px; margin: 0 0 12px; }
  .bloque li.li--sugerido { background: var(--paloma); padding: 9px 12px; border-radius: 2px; }
  .bloque li.li--sugerido::before { display: none; }
  .bloque--sugerido li::before { border-color: var(--tinta-2); }
  /* En modo edición, el campo vacío se ve discreto, sin fondo. */
  .sugiere--vacio { background: none; padding: 0; color: var(--tinta-2); margin: 4px 0 0; }
  .sugiere--bloque.sugiere--vacio { margin: 0 0 10px; }
  .sugiere--vacio .sugiere__area { margin-left: 4px; }

  /* ── Cierre ─────────────────────────────────────────────────────── */
  .cierre { border-top: 3px solid var(--azul); padding-top: 18px; }
  .cierre h2 { font-family: var(--letra); font-weight: bold; font-size: var(--letra-20px); line-height: var(--interlineado-1-2); margin: 0 0 6px; color: var(--azul-osc); }
  .cierre > p { margin: 0 0 18px; font-size: var(--letra-13px); color: var(--tinta-2); text-align: justify; }
  .bifurcaciones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  /* Tarjeta: contenido centrado en vertical, mismo aire arriba y abajo. */
  .bif {
    background: var(--paloma); border-radius: 2px; padding: 13px 15px; min-width: 0;
    display: flex; flex-direction: column; justify-content: center;
  }
  .bif b { display: flex; gap: 6px; font-weight: bold; font-size: var(--letra-14px); margin-bottom: 4px; color: var(--azul-osc); }
  .bif b > .tx { flex: 1 1 auto; }
  .bif .tx2 { font-size: var(--letra-13px); color: var(--tinta); overflow-wrap: anywhere; display: block; text-align: justify; }

  /* ── Modo edición ───────────────────────────────────────────────────
     Mientras se edita, la hoja crece con lo que se escribe para que
     nada quede tapado; al terminar la edición se rearman las hojas. */
  .en-edicion .pagina { height: auto; min-height: var(--hoja-alto); overflow: visible; }
  .en-edicion .pagina__cuerpo { overflow: visible; }
  [contenteditable="true"] { outline: 1px dashed var(--azul); outline-offset: 3px; border-radius: 2px; cursor: text; }
  [contenteditable="true"]:focus { outline: 2px solid var(--azul); outline-offset: 3px; background: #F2F7FC; }
  [contenteditable="true"]:empty::before { content: attr(data-pista); color: var(--tinta-2); font-weight: normal; }

  .quitar {
    flex: none; border: 0; background: none; cursor: pointer; padding: 0 3px;
    color: var(--tinta-2); font-size: var(--letra-14px); line-height: 1; font-family: var(--letra);
    align-self: flex-start; margin-top: 1px;
  }
  .quitar:hover { color: var(--borrar); }
  .quitar:focus-visible { outline: 2px solid var(--borrar); outline-offset: 1px; }
  .etapa__banda .quitar { color: var(--acento-texto); }
  /* Flechas para subir o bajar un punto o un capítulo. */
  .mover { display: inline-flex; gap: 3px; flex: none; align-self: flex-start; }
  .mover button {
    font-family: var(--letra); font-size: var(--letra-12px); line-height: 1; font-weight: bold;
    border: 1px solid var(--linea); background: var(--papel); color: var(--azul-osc);
    border-radius: 2px; padding: 3px 6px; cursor: pointer;
  }
  .mover button:hover:not(:disabled) { background: var(--azul); border-color: var(--azul); color: #FFFFFF; }
  .mover button:focus-visible { outline: 2px solid var(--azul); outline-offset: 1px; }
  .mover button:disabled { color: var(--linea); cursor: default; }
  /* Agregar un punto justo debajo de otro (modo edición). */
  .insertar {
    flex: none; align-self: flex-start; cursor: pointer;
    font-family: var(--letra); font-size: var(--letra-12px); font-weight: bold; line-height: 1;
    border: 1px dashed var(--azul); background: var(--papel); color: var(--azul);
    border-radius: 2px; padding: 3px 6px;
  }
  .insertar:hover { background: var(--azul); color: #FFFFFF; }
  .insertar:focus-visible { outline: 2px solid var(--azul); outline-offset: 1px; }
  .sumar {
    font-family: var(--letra); font-size: var(--letra-12px); font-weight: bold;
    border: 1px dashed var(--azul); background: none; color: var(--azul);
    border-radius: 2px; padding: 6px 10px; cursor: pointer; margin-top: 10px; width: 100%;
  }
  .sumar:hover { background: var(--azul); color: #FFFFFF; }
  .sumar:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
  .vacio { font-size: var(--letra-12px); color: var(--tinta-2); font-style: italic; margin: 0; }

  /* ── Hoja de medición: invisible, sirve para saber qué cabe ─────── */
  #medidor { position: absolute; left: -10000px; top: 0; visibility: hidden; pointer-events: none; }
  #medidor .pagina { width: var(--hoja-ancho); height: var(--hoja-alto); }

  /* ── Teléfono y pantallas angostas ─────────────────────────────────
     Las hojas se ajustan al ancho y crecen con su contenido. La
     paginación y los números del índice siguen siendo los del papel. */
  @media screen and (max-width: 880px) {
    .hoja { padding-inline: 10px; }
    .hojas { align-items: stretch; }
    .ayuda { width: auto; }
    .hojas > .pagina { width: auto; height: auto; overflow: visible; scroll-margin-top: 120px; }   /* la barra ocupa dos filas */
    .hojas > .pagina .pagina__cuerpo { overflow: visible; padding: 22px 18px 10px; }
    .hojas > .pagina .pagina__franja { padding: 10px 18px; height: auto; flex-wrap: wrap; }
    .hojas > .pagina .pagina__pie { padding: 0 18px; height: auto; }
    .hojas > .pagina .pagina__pie > div { padding: 10px 0; grid-template-columns: 1fr auto; }
    .hojas > .pagina .pie__centro { display: none; }
    .hojas > .pagina .cabecera { padding-top: 8px; }
    .hojas > .pagina h1 { font-size: var(--letra-28px); }
    .hojas > .pagina .indice__lista { columns: 1; }
    .hojas > .pagina .bifurcaciones { grid-template-columns: 1fr; }
  }

  /* ── Impresión ──────────────────────────────────────────────────────
     Cada hoja es una página A4 sin márgenes extra: lo que se ve en
     pantalla es lo que sale en papel. Los enlaces del índice y de
     «Volver al índice» siguen funcionando al guardar como PDF. */
  @page { size: A4; margin: 0; }
  @media print {
    html, body { background: #FFFFFF; margin: 0; padding: 0; }
    .barra, .ayuda, .lateral, .sumar, .quitar, .mover, .insertar { display: none !important; }
    /* La hoja de medición sigue activa (invisible) para que, si se rearman
       las hojas al imprimir, se midan igual que en pantalla. */
    .hoja { max-width: none; margin: 0; padding: 0; }
    .marco { display: block; }
    .hojas { display: block; }
    .pagina { width: var(--hoja-ancho); height: var(--hoja-alto); break-after: page; page-break-after: always; }
    .pagina:last-child { break-after: auto; page-break-after: auto; }
    .pagina, .pagina * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    [contenteditable="true"] { outline: 0 !important; background: none !important; }
  }

  /* ── Versión publicada ─────────────────────────────────────────────
     Sin índice lateral, hojas agrandadas al ancho disponible y botón
     «Volver arriba». Solo se activa en la versión solo de lectura. */
  .publicado .marco { display: block; }
  .publicado .hoja { padding-top: 24px; }   /* sin barra: 24 px de aire sobre la primera hoja */
  @media screen and (min-width: 881px) {
    .publicado .hojas > .pagina {
      zoom: var(--zoom-hojas, 1);                              /* agrandada hasta el ancho de la barra */
      scroll-margin-top: calc(24px / var(--zoom-hojas, 1));    /* al saltar, la hoja queda a 24 px del borde superior */
    }
  }
  .arriba {
    position: fixed; right: 24px; bottom: 24px; z-index: 30;
    font-family: var(--letra); font-size: var(--letra-13px); font-weight: bold;
    background: var(--azul); color: #FFFFFF; border: 0; border-radius: 2px;
    padding: 10px 16px; cursor: pointer;
  }
  .arriba:hover { background: var(--azul-osc); }
  .arriba:focus-visible { outline: 2px solid var(--azul-osc); outline-offset: 2px; }
  @media screen and (max-width: 880px) {
    .publicado .hojas > .pagina { scroll-margin-top: 16px; }   /* teléfono: al saltar, la hoja queda a 16 px del borde */
  }
  @media print { .arriba { display: none !important; } }

rección por producto como destino de anuncios, sin redirecciones.","n":""}]},{"titulo":"Identificación de elementos para medición","puntos":[{"t":"**Identificador escrito en cada elemento que se mide.**","n":""},{"t":"**Forma** · tipo + área + producto + paso + nombre, con guion medio.","n":""},{"t":"**pag** · llegada a una pantalla.","n":"pag-ecom-auto-digital-p3-planes"},{"t":"**btn** · clic en un botón.","n":"btn-ecom-auto-digital-p1-continuar"},{"t":"**opc** · elección de una opción.","n":"opc-ecom-auto-digital-p3-deducible"},{"t":"**txt** · escritura en un campo.","n":"txt-ecom-auto-digital-p2-patente"},{"t":"Producto con el mismo nombre que en la dirección web; paso con la letra p y su número.","n":"auto-digital · p1, p2, p3"},{"t":"**El identificador no cambia aunque cambie el texto del botón.**","n":""},{"t":"Identificador único en todo el sitio y el mismo en Google Analytics 4 y en Salesforce.","n":""},{"t":"Diccionario de identificadores definido antes de construir.","n":""}]}]},{"titulo":"Software adicionales","nota":"Salesforce es donde se lleva el control comercial del canal; las demás plataformas se conectan con él. Cada capítulo indica qué datos viajan en cada conexión.","bloques":[{"titulo":"Salesforce","puntos":[{"t":"**Cotización** · datos del cliente, producto, plan, precio y paso en que quedó.","n":""},{"t":"**Caídos** · persona que dejó el recorrido, paso de salida y estado de la recuperación.","n":""},{"t":"**Póliza emitida** · asociada a su cotización, con número, prima y vigencia.","n":""},{"t":"**Origen de cada cliente** · canal, campaña y anuncio que lo trajeron, con los parámetros de campaña y el identificador de clic de Google Ads y de Meta.","n":""},{"t":"**Venta asistida** · la cotización a la vista del ejecutivo o del asistente virtual.","n":""},{"t":"Si Salesforce no responde, la cotización sigue su curso y los datos se registran al volver la conexión.","n":""}]},{"titulo":"Salesforce y Power BI","puntos":[{"t":"**Cotizaciones, caídos, pólizas emitidas y ventas** por producto, canal y campaña, hacia los tableros generados.","n":""},{"t":"Actualización automática y diaria (sin envíos manual).","n":""},{"t":"Unión con los datos de Google Analytics 4, para ver el recorrido completo, de la visita a la póliza.","n":""}]},{"titulo":"Salesforce y Google Ads","puntos":[{"t":"**Conversiones desde el sitio** · cotización completada y póliza emitida.","n":""},{"t":"**Venta cerrada desde Salesforce** · asociada al clic de Google Ads que la originó, con el valor de la prima.","n":""},{"t":"Google Analytics 4 vinculado a Google Ads, con sus conversiones y audiencias.","n":""},{"t":"Clientes vigentes desde Salesforce, para excluirlos o para ofrecerles otro producto, según su aceptación.","n":""}]},{"titulo":"Salesforce con correo, WhatsApp y SMS","puntos":[{"t":"**Caídos desde Salesforce** hacia la secuencia de recuperación.","n":""},{"t":"Estado de cada envío de vuelta a Salesforce: enviado, entregado, leído, respondido y fallido.","n":""},{"t":"Baja de comunicaciones registrada en Salesforce y común a los tres canales.","n":""},{"t":"Número de WhatsApp de la empresa verificado por Meta, con plantillas aprobadas.","n":""},{"t":"SMS desde un número corto local.","n":""}]},{"titulo":"Data Studio","puntos":[{"t":"**Recorrido del cotizador** desde Google Analytics 4.","n":""},{"t":"**Inversión y resultados** desde Google Ads.","n":""},{"t":"Mismos nombres de producto y de campaña que en Salesforce y en Power BI.","n":""}]},{"titulo":"Tarificación y emisión","puntos":[{"t":"**Precio calculado por el sistema de tarificación de la compañía.**","n":""},{"t":"Respuesta desglosada por componente de prima.","n":""},{"t":"Versión de la tarifa registrada en cada cotización.","n":""},{"t":"Valor de la UF con su fecha de aplicación.","n":""},{"t":"Tiempo máximo de respuesta y mensaje en pantalla cuando se agota.","n":""},{"t":"Emisión en el sistema central de pólizas, con la póliza de vuelta a Salesforce.","n":""}]}]}],"cie
